name: Claude Code Review

# Runs a Claude code review on a pull request, but ONLY when the
# "claude_review" label is added to the PR.

on:
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    # Gate: only run when the label just added is exactly "claude_review"
    if: github.event.label.name == 'claude_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for code quality, potential bugs,
            security issues, and adherence to best practices. Leave your
            feedback as inline comments on the relevant lines, plus a
            short summary comment on the PR.
          claude_args: '--allowed-tools mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*)'
