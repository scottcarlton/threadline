name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Write placeholder .env
        run: cp .env.ci .env
      - name: Run svelte-check
        run: bun run check

  test:
    name: Test
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Write placeholder .env
        run: cp .env.ci .env
      - name: Run tests
        run: bun run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Write placeholder .env
        run: cp .env.ci .env
      - name: Build
        run: bun run build

  rls:
    name: RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `version` is deliberately omitted. Per the action's own contract it then
      # detects the CLI version from the root lockfile, and `supabase` is
      # already a devDependency here, so bun.lock is the single source of truth
      # for which CLI everyone runs -- CI and laptops alike.
      #
      # It was `version: latest`, which re-resolves through the GitHub API on
      # every run. That call is unauthenticated and rate limited, and when it
      # trips the job dies before Docker or a single migration is touched:
      #
      #   ##[error]Failed to resolve latest Supabase CLI release: rate limit exceeded
      #   ##[error]Process completed with exit code 127
      #
      # which reads exactly like a policy regression. The retry loop below
      # cannot help: the failure is in this step, not in `supabase start`, and
      # is deterministic for the whole run.
      #
      # Hard-coding a version here instead would work, but it would be a second
      # source of truth that silently drifts from package.json.
      - uses: supabase/setup-cli@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Start Supabase
        # `supabase start` intermittently fails on a fresh runner with
        # "failed to bind host port 0.0.0.0:54322: address already in use",
        # a Docker networking race rather than anything about the branch.
        # It has happened twice, and it surfaces as a red RLS job that ran
        # zero tests, which reads like a policy regression. Retry with a
        # clean slate between attempts so a runner hiccup cannot look like
        # a real failure.
        run: |
          for attempt in 1 2 3; do
            if supabase start; then
              exit 0
            fi
            echo "::warning::supabase start failed on attempt $attempt, cleaning up and retrying"
            supabase stop --no-backup || true
            docker ps -aq | xargs -r docker rm -f || true
            sleep 10
          done
          echo "::error::supabase start failed 3 times"
          exit 1
      - name: Write .env from the local stack
        run: supabase status -o env > .env
      - name: Map env names
        run: |
          {
            echo "PUBLIC_SUPABASE_URL=$(grep '^API_URL=' .env | cut -d= -f2- | tr -d '\"')"
            echo "PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' .env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' .env | cut -d= -f2- | tr -d '\"')"
          } >> .env
      - name: Run RLS tests
        run: bun run test:rls
      - name: Stop Supabase
        if: always()
        run: supabase stop
